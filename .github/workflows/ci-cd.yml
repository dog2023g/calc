name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: write    
  packages: write    # чтобы публиковать образ в ghcr.io

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Запустить тесты
        run: pytest -q

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Код возврата semgrep ci: 0 - без уязвимостей, 1 - есть находки уязвимостей,
      # 2 и выше - сбой (ошибка конфигурации, неверный токен и т.д.)
      - name: Сканирование Semgrep
        run: |
          mkdir -p semgrep-out
          set +e
          semgrep ci \
            --json-output=semgrep-out/semgrep.json \
            --sarif-output=semgrep-out/semgrep.sarif \
            --text-output=semgrep-out/semgrep.txt
          rc=$?
          set -e
          echo "Код возврата semgrep: $rc"
          if [ "$rc" -gt 1 ]; then
            exit "$rc"
          fi

      - name: Добавить отчёт в summary
        if: always()
        run: python3 scripts/semgrep_summary.py semgrep-out/semgrep.json >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить отчёты Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-out/
          if-no-files-found: warn

  llm-review:
    name: LLM-проверка кода
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: LLM-анализ кода в /app
        continue-on-error: true
        run: python3 scripts/llm_review.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://api.groq.com/openai/v1   
          LLM_MODEL: openai/gpt-oss-120b                          
          SCAN_DIR: app
          FAIL_ON_HIGH: "false"

      - name: Сохранить отчёт LLM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-report
          path: report.md
          if-no-files-found: warn
          
  bump-version:
    name: Обновить версию
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна полная история, чтобы прочитать сообщение коммита

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Посчитать новую версию
        id: bump
        run: python3 scripts/version_up.py

      - name: Закоммитить VERSION и поставить тег
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.new_version }}"

  build-and-push:
    name: Собрать и опубликовать образ
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Войти в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Собрать и запушить образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.bump-version.outputs.new_version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-scan:
    name: Анализ образа (Trivy)
    needs: [bump-version, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ needs.bump-version.outputs.new_version }}
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0
    steps:
      - uses: actions/checkout@v4   # нужен scripts/trivy_summary.py
        with:
          ref: main

      - name: Войти в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Скачать опубликованный образ
        run: docker pull "$IMAGE"

      - name: Сканирование Trivy
        run: |
          mkdir -p trivy-out
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-out:/out" \
            "$TRIVY_IMAGE" \
            image --no-progress --format json --output /out/trivy.json "$IMAGE"

      - name: Добавить отчёт в summary
        if: always()
        run: python3 scripts/trivy_summary.py trivy-out/trivy.json >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить отчёт Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-out/
          if-no-files-found: warn

  dast:
    name: DAST (OWASP ZAP, API scan)
    needs: [bump-version, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Войти в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Запустить приложение из опубликованного образа
        run: |
          docker network create zapnet
          docker run -d --name calc --network zapnet -p 8000:8000 \
            ghcr.io/${{ github.repository }}:${{ needs.bump-version.outputs.new_version }}

      - name: Дождаться готовности и получить OpenAPI-спецификацию
        run: |
          mkdir -p zap-out
          chmod 777 zap-out   # в контейнере ZAP работает пользователь zap, ему нужна запись
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              curl -fsS http://localhost:8000/openapi.json -o zap-out/openapi.json
              echo "Приложение готово, спецификация сохранена"
              exit 0
            fi
            sleep 2
          done
          echo "Приложение не запустилось за 60 секунд"
          docker logs calc
          exit 1

      - name: Сканирование ZAP (Получение эндпоинтов по OpenAPI, пауку. Активное сканирование)
        run: |
          cp .zap/plan.yaml zap-out/plan.yaml
          set +e
          docker run --name zap --network zapnet \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/plan.yaml
          rc=$?
          set -e
          docker cp zap:/home/zap/.ZAP/zap.log zap-out/zap.log || echo "zap.log не найден"
          docker rm -f zap
          echo "Код возврата ZAP: $rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi


      - name: Добавить отчёт в summary
        if: always()
        run: |
          if [ -f zap-out/zap-report.md ]; then
            cat zap-out/zap-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Сохранить отчёты ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/
          if-no-files-found: warn

      - name: Логи приложения
        if: failure()
        run: docker logs calc

      - name: Остановить приложение
        if: always()
        run: docker rm -f calc

# Из-за появления уязвимых RCE функций отключаем деплой. В деплое остается безопасная версия калькулятора
