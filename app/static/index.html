<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2a6b; --ink-soft:#6b76a8; --violet:#7c3aed; --violet-2:#a855f7; --indigo:#312e81;
  --drop:#f0f1f8; --mono:'JetBrains Mono','Space Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  display:grid;place-items:center;padding:24px 16px;font-family:var(--mono);color:var(--ink);
  background:
    radial-gradient(420px 420px at 18% 22%,rgba(168,85,247,.16),transparent 70%),
    radial-gradient(480px 480px at 84% 78%,rgba(99,102,241,.14),transparent 70%),
    #fff;
}
.panel{
  position:relative;width:min(380px,100%);padding:22px 20px 24px;border-radius:40px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(250,248,255,.6));
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 1px rgba(124,58,237,.08),0 0 46px rgba(124,58,237,.16),0 30px 60px -24px rgba(49,46,129,.22),inset 0 1px 0 #fff;
}
.panel.pulse{animation:glow .9s ease-out}
.panel.pulse::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(105deg,transparent 35%,rgba(168,85,247,.28) 50%,transparent 65%);
  transform:translateX(-120%);animation:wave .9s ease-out}
@keyframes wave{to{transform:translateX(120%)}}
@keyframes glow{40%{box-shadow:0 0 0 1px rgba(124,58,237,.2),0 0 90px rgba(124,58,237,.38),0 30px 60px -24px rgba(49,46,129,.22),inset 0 1px 0 #fff}}

#tail{height:112px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow:hidden;padding:0 4px 0 14px;
  -webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%)}
.h{position:relative;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--violet);
  border-left:1.5px solid rgba(124,58,237,.35);padding-left:10px}
.h::before{content:"";position:absolute;left:-4.25px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--violet-2)}
.h b{font-weight:600}
.h.new{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(22px);opacity:0}}

#expr{min-height:20px;text-align:right;font-size:14px;color:var(--ink-soft);padding:0 6px}
#expr .g{color:var(--violet);font-weight:600}
#disp{text-align:right;font-size:52px;font-weight:300;line-height:1.15;padding:2px 6px 18px;white-space:nowrap;overflow:hidden;color:var(--ink);letter-spacing:-.02em}
#disp.err{font-size:17px;line-height:2.6;color:#b4234f;letter-spacing:0;white-space:normal}
#disp.reveal{animation:reveal .7s ease-out}
@keyframes reveal{from{filter:blur(9px);opacity:0;transform:scale(.96)}}

.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.b{position:relative;aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;font:400 22px var(--mono);color:var(--ink);
  background:var(--drop);box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(49,46,129,.06);overflow:hidden;
  transition:transform .18s ease-out,box-shadow .2s;will-change:transform;-webkit-tap-highlight-color:transparent}
.b:hover{box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(124,58,237,.14)}
.b:active,.b.down{transform:scale(.93)!important}
.b:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.b::after{content:"";position:absolute;inset:0;border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(168,85,247,.55),rgba(124,58,237,0) 70%)}
.b.hit::after{animation:impulse .55s ease-out}
@keyframes impulse{0%{opacity:.95;transform:scale(.2)}100%{opacity:0;transform:scale(1.5)}}
.b.fn{color:var(--ink-soft);background:#e8e9f5}
.b.op{background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1.5px var(--violet),0 0 14px rgba(124,58,237,.12);color:var(--violet);font-size:26px}
.b.op.on{background:rgba(124,58,237,.1)}
.b.eq{background:linear-gradient(135deg,var(--indigo),var(--violet) 55%,var(--violet-2));color:#fff;font-size:28px;
  box-shadow:0 10px 24px -6px rgba(124,58,237,.55)}
.b.eq::after{background:radial-gradient(circle,rgba(255,255,255,.6),transparent 70%)}

.fly{position:fixed;z-index:9;pointer-events:none;font:600 26px var(--mono);color:var(--violet);
  text-shadow:0 0 14px rgba(168,85,247,.7);left:0;top:0}
.foot{margin-top:18px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:11px;color:var(--ink-soft)}
.dot{width:7px;height:7px;border-radius:50%;background:#c9cbe0}
.dot.ok{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.6)}
.dot.bad{background:#e11d48}

.tool-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tool-btn,.comments-btn{
  border:0;cursor:pointer;font:600 12px var(--mono);color:var(--ink);
  background:rgba(255,255,255,.68);border:1px solid rgba(124,58,237,.16);
  box-shadow:inset 0 1px 0 #fff,0 5px 14px rgba(49,46,129,.08);
  transition:transform .18s ease,box-shadow .2s,background .2s;
}
.tool-btn{min-height:42px;border-radius:18px;padding:0 14px}
.tool-btn:hover,.comments-btn:hover{box-shadow:inset 0 1px 0 #fff,0 8px 20px rgba(124,58,237,.13)}
.tool-btn:active,.comments-btn:active{transform:scale(.97)}
.tool-btn:focus-visible,.comments-btn:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.comments-btn{
  position:fixed;right:22px;bottom:22px;z-index:20;
  min-width:132px;height:44px;border-radius:22px;padding:0 17px;
  background:linear-gradient(135deg,var(--indigo),var(--violet) 58%,var(--violet-2));
  color:#fff;box-shadow:0 12px 28px -8px rgba(124,58,237,.58);
}
.tool-modal[hidden]{display:none}
.tool-modal{
  position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;
  background:rgba(27,42,107,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.modal-card{
  width:min(560px,100%);max-height:min(760px,calc(100vh - 40px));overflow:auto;
  padding:20px;border-radius:28px;
  background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(250,248,255,.94));
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 1px rgba(124,58,237,.08),0 26px 80px rgba(49,46,129,.28),inset 0 1px 0 #fff;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.modal-title{font-size:18px;font-weight:600;color:var(--ink)}
.modal-close{
  width:34px;height:34px;border:0;border-radius:50%;cursor:pointer;
  background:var(--drop);color:var(--ink);font:600 16px var(--mono)
}
.modal-close:hover{background:#e7e8f3}
.form-stack{display:grid;gap:12px}
.field{display:grid;gap:7px}
.field label{font-size:11px;color:var(--ink-soft)}
.field input,.field textarea,.field select{
  width:100%;border:1px solid rgba(124,58,237,.14);border-radius:16px;
  outline:0;padding:12px 14px;background:rgba(255,255,255,.78);color:var(--ink);
  font:400 13px var(--mono);box-shadow:inset 0 1px 3px rgba(49,46,129,.04);
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:rgba(124,58,237,.45);box-shadow:0 0 0 3px rgba(124,58,237,.09)
}
.field textarea{min-height:130px;resize:vertical}
.form-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:3px}
.action-btn{
  min-height:42px;padding:0 16px;border:0;border-radius:16px;cursor:pointer;
  font:600 12px var(--mono);color:var(--ink);background:var(--drop)
}
.action-btn.primary{color:#fff;background:linear-gradient(135deg,var(--indigo),var(--violet) 58%,var(--violet-2));box-shadow:0 10px 24px -7px rgba(124,58,237,.48)}
.action-btn:disabled{opacity:.6;cursor:wait}
.result-box{
  margin-top:14px;padding:13px 15px;border-radius:16px;
  background:rgba(124,58,237,.06);border:1px solid rgba(124,58,237,.11);
  font-size:13px;white-space:pre-wrap;word-break:break-word;color:var(--ink)
}
.result-box.err{color:#b4234f;background:rgba(180,35,79,.06);border-color:rgba(180,35,79,.14)}
.comment-list{margin-top:4px;max-height:270px;overflow:auto}
.comment-list:empty::before{content:"Комментариев пока нет";display:block;color:var(--ink-soft);font-size:12px;padding:10px 2px}
.comment-list ul{padding-left:20px;color:var(--ink);font-size:12px;line-height:1.65}
.comment-list li+li{margin-top:7px}
.comment-form{margin-top:16px;padding-top:15px;border-top:1px solid rgba(124,58,237,.1)}
@media (max-width:520px){
  .comments-btn{right:14px;bottom:14px}
  .tool-row{grid-template-columns:1fr}
}

@media (max-width:360px){#disp{font-size:42px}.pad{gap:9px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="panel" id="panel">
  <div id="tail" aria-label="История вычислений"></div>
  <div id="expr"></div>
  <div id="disp" aria-live="polite">0</div>
  <div class="pad" id="pad">
    <button class="b fn" data-k="c" aria-label="Очистить">C</button>
    <button class="b fn" data-k="n" aria-label="Сменить знак">±</button>
    <button class="b op" data-k="mod" aria-label="Остаток от деления">mod</button>
    <button class="b op" data-k="/" aria-label="Разделить">÷</button>
    <button class="b" data-k="7">7</button><button class="b" data-k="8">8</button><button class="b" data-k="9">9</button>
    <button class="b op" data-k="*" aria-label="Умножить">×</button>
    <button class="b" data-k="4">4</button><button class="b" data-k="5">5</button><button class="b" data-k="6">6</button>
    <button class="b op" data-k="-" aria-label="Вычесть">−</button>
    <button class="b" data-k="1">1</button><button class="b" data-k="2">2</button><button class="b" data-k="3">3</button>
    <button class="b op" data-k="+" aria-label="Сложить">+</button>
    <button class="b fn" data-k="b" aria-label="Стереть символ">⌫</button>
    <button class="b" data-k="0">0</button><button class="b" data-k=".">.</button>
    <button class="b eq" data-k="=" aria-label="Равно">=</button>
  </div>
  <div class="foot"><span class="dot" id="dot"></span><span id="ver">API…</span></div>


  <div class="tool-row">
    <button class="tool-btn" id="evaluateOpen">⌁ Выражение</button>
    <button class="tool-btn" id="formulaOpen">ƒ Формула</button>
  </div>
</main>

<button class="comments-btn" id="commentsOpen" aria-label="Открыть комментарии">Комментарии</button>

<div class="tool-modal" id="evaluateModal" hidden>
  <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="evaluateTitle">
    <div class="modal-head">
      <div class="modal-title" id="evaluateTitle">Сложное выражение</div>
      <button class="modal-close" data-close="evaluateModal" aria-label="Закрыть">×</button>
    </div>
    <form class="form-stack" id="evaluateForm">
      <div class="field">
        <label for="expressionInput">expression</label>
        <textarea id="expressionInput" name="expression" spellcheck="false" placeholder="Например: (12 + 8) * 3 / 2"></textarea>
      </div>
      <div class="form-actions">
        <button class="action-btn" type="button" data-close="evaluateModal">Отмена</button>
        <button class="action-btn primary" type="submit">Вычислить</button>
      </div>
    </form>
    <div class="result-box" id="evaluateResult" hidden></div>
  </section>
</div>

<div class="tool-modal" id="formulaModal" hidden>
  <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="formulaTitle">
    <div class="modal-head">
      <div class="modal-title" id="formulaTitle">Формула из YAML</div>
      <button class="modal-close" data-close="formulaModal" aria-label="Закрыть">×</button>
    </div>
    <form class="form-stack" id="formulaForm">
      <div class="field">
        <label for="formulaA">a</label>
        <input id="formulaA" name="a" type="number" step="any" required placeholder="12">
      </div>
      <div class="field">
        <label for="formulaB">b</label>
        <input id="formulaB" name="b" type="number" step="any" required placeholder="3">
      </div>
      <div class="field">
        <label for="formulaOp">op</label>
        <input id="formulaOp" name="op" list="formulaOps" required value="add" placeholder="add">
        <datalist id="formulaOps">
          <option value="add"></option>
          <option value="subtract"></option>
          <option value="multiply"></option>
          <option value="divide"></option>
        </datalist>
      </div>
      <div class="form-actions">
        <button class="action-btn" type="button" data-close="formulaModal">Отмена</button>
        <button class="action-btn primary" type="submit">Получить результат</button>
      </div>
    </form>
    <div class="result-box" id="formulaResult" hidden></div>
  </section>
</div>

<div class="tool-modal" id="commentsModal" hidden>
  <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="commentsTitle">
    <div class="modal-head">
      <div class="modal-title" id="commentsTitle">Комментарии</div>
      <button class="modal-close" data-close="commentsModal" aria-label="Закрыть">×</button>
    </div>
    <div class="comment-list" id="commentList" aria-live="polite"></div>
    <form class="form-stack comment-form" id="commentForm">
      <div class="field">
        <label for="commentInput">Новый комментарий</label>
        <textarea id="commentInput" name="comment" maxlength="1000" placeholder="Напишите комментарий…" required></textarea>
      </div>
      <div class="form-actions">
        <button class="action-btn primary" type="submit">Добавить</button>
      </div>
    </form>
    <div class="result-box" id="commentResult" hidden></div>
  </section>
</div>

<script>
(() => {
  const API = '';
  const OPS = {'+':['add','+'],'-':['subtract','−'],'*':['multiply','×'],'/':['divide','÷'],'mod':['mod','mod']};
  const $ = id => document.getElementById(id);
  const disp = $('disp'), expr = $('expr'), tail = $('tail'), panel = $('panel'), pad = $('pad');
  const btn = k => document.querySelector(`[data-k="${CSS.escape(k)}"]`);

  let acc = null, op = null, cur = '0', entered = true;
  const history = [];

  const fmt = n => String(parseFloat(Number(n).toPrecision(12)));
  const val = () => entered ? cur : (acc !== null ? fmt(acc) : cur);

  function render(reveal) {
    const v = val();
    disp.classList.remove('err');
    disp.textContent = v;
    disp.style.fontSize = Math.max(26, 52 - Math.max(0, v.length - 8) * 4) + 'px';
    if (reveal) { disp.classList.remove('reveal'); void disp.offsetWidth; disp.classList.add('reveal'); }
    pad.querySelectorAll('.op').forEach(b => b.classList.toggle('on', !entered && b.dataset.k === op));
  }
  function setExpr(showGlyph) {
    expr.textContent = '';
    if (acc === null || !op) return;
    expr.append(fmt(acc) + ' ');
    const g = document.createElement('span');
    g.className = 'g'; g.id = 'glyph'; g.textContent = OPS[op][1];
    if (!showGlyph) g.style.opacity = 0;
    expr.append(g);
  }
  function addHistory(text, res) {
    history.push({text, res});
    if (history.length > 30) history.shift();
    tail.textContent = '';
    history.slice(-6).forEach((h, i, arr) => {
      const d = document.createElement('div');
      d.className = 'h' + (i === arr.length - 1 ? ' new' : '');
      d.style.opacity = Math.max(.15, 1 - (arr.length - 1 - i) * .24);
      const s = document.createElement('span'); s.textContent = h.text;
      const b = document.createElement('b'); b.textContent = h.res;
      d.append(s, b); tail.append(d);
    });
  }
  function fail(msg) {
    acc = null; op = null; cur = '0'; entered = true; setExpr(true);
    disp.textContent = msg; disp.style.fontSize = ''; disp.classList.add('err');
  }
  async function calc(k, a, b) {
    // /mod intentionally accepts strings (ModInput: a: str, b: str).
    // Other calculator endpoints keep the numeric payload used by the original calculator.
    const body = k === 'mod'
      ? {a: String(a), b: String(b)}
      : {a, b};
    const r = await fetch(`${API}/${OPS[k][0]}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Некорректный ввод');
    return data.result;
  }

  function fly(from, glyph) {
    const g = $('glyph');
    if (!g || matchMedia('(prefers-reduced-motion: reduce)').matches) { if (g) g.style.opacity = 1; return; }
    const a = from.getBoundingClientRect(), t = g.getBoundingClientRect();
    const el = document.createElement('span'); el.className = 'fly'; el.textContent = glyph;
    document.body.append(el);
    const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2, x1 = t.left + t.width / 2, y1 = t.top + t.height / 2;
    el.animate([
      {transform: `translate(${x0}px,${y0}px) translate(-50%,-50%) scale(1.3)`, filter: 'blur(0)'},
      {transform: `translate(${x0 + (x1 - x0) * .5}px,${y0 + (y1 - y0) * .6 - 18}px) translate(-50%,-50%) scale(1.1,.7)`, filter: 'blur(2px)', offset: .5},
      {transform: `translate(${x1}px,${y1}px) translate(-50%,-50%) scale(1)`, filter: 'blur(0)'}
    ], {duration: 520, easing: 'cubic-bezier(.3,.7,.2,1)'}).onfinish = () => { g.style.opacity = 1; el.remove(); };
  }

  async function handle(k, el) {
    try {
      if (k >= '0' && k <= '9') {
        if (!entered) { cur = k; entered = true; }
        else if (cur.replace(/[-.]/g, '').length < 12) cur = cur === '0' ? k : cur + k;
        render();
      } else if (k === '.') {
        if (!entered) { cur = '0.'; entered = true; } else if (!cur.includes('.')) cur += '.';
        render();
      } else if (OPS[k]) {
        if (op && acc !== null && entered) {
          const r = await calc(op, acc, parseFloat(cur));
          addHistory(`${fmt(acc)} ${OPS[op][1]} ${fmt(cur)} =`, fmt(r));
          acc = r;
        } else if (acc === null) acc = parseFloat(cur);
        op = k; entered = false;
        setExpr(false); render(); fly(el, OPS[k][1]);
      } else if (k === '=') {
        if (!op) return;
        const b = entered ? parseFloat(cur) : acc;
        const r = await calc(op, acc, b);
        addHistory(`${fmt(acc)} ${OPS[op][1]} ${fmt(b)} =`, fmt(r));
        cur = fmt(r); acc = null; op = null; entered = false;
        setExpr(true); render(true);
        panel.classList.remove('pulse'); void panel.offsetWidth; panel.classList.add('pulse');
      } else if (k === 'n') {
        const n = -parseFloat(val());
        cur = fmt(n === 0 ? 0 : n); entered = true; render();
      } else if (k === 'b') {
        if (entered) { cur = cur.slice(0, -1); if (cur === '' || cur === '-') cur = '0'; render(); }
      } else if (k === 'c') {
        if (acc === null && cur === '0' && history.length) { history.length = 0; tail.textContent = ''; }
        acc = null; op = null; cur = '0'; entered = true; setExpr(true); render();
      }
    } catch (e) {
      fail(e instanceof TypeError ? 'Нет связи с API. Проверьте, что сервер запущен.' : e.message);
    }
  }

  let chain = Promise.resolve();
  const press = (k, el) => {
    el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
    chain = chain.then(() => handle(k, el));
  };
  pad.addEventListener('click', e => { const b = e.target.closest('.b'); if (b) press(b.dataset.k, b); });

  const alias = {Enter: '=', Backspace: 'b', Escape: 'c', Delete: 'c', ',': '.', x: '*', X: '*', C: 'c', c: 'c', m: 'mod', M: 'mod'};
  addEventListener('keydown', e => {
    // Пока пользователь печатает в форме, клавиши должны работать только в поле
    // и не передаваться калькулятору (включая Enter/Backspace).
    const target = e.target;
    if (target instanceof HTMLInputElement ||
        target instanceof HTMLTextAreaElement ||
        target instanceof HTMLSelectElement ||
        target?.isContentEditable) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = alias[e.key] || e.key, el = btn(k);
    if (!el) return;
    e.preventDefault();
    el.classList.add('down'); setTimeout(() => el.classList.remove('down'), 120);
    press(k, el);
  });

  // магнитное притяжение кнопок к курсору
  if (matchMedia('(hover: hover)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const btns = [...pad.querySelectorAll('.b')];
    pad.addEventListener('pointermove', e => {
      for (const b of btns) {
        const r = b.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy), reach = r.width * 1.05;
        b.style.transform = d < reach ? `translate(${dx * .22 * (1 - d / reach) * 1.6}px,${dy * .22 * (1 - d / reach) * 1.6}px)` : '';
      }
    });
    pad.addEventListener('pointerleave', () => btns.forEach(b => b.style.transform = ''));
  }


  // дополнительные формы
  const evaluateModal = $('evaluateModal');
  const formulaModal = $('formulaModal');
  const commentsModal = $('commentsModal');

  function openModal(modal) {
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeModal(modal) {
    modal.hidden = true;
    if ([evaluateModal, formulaModal, commentsModal].every(m => m.hidden)) {
      document.body.style.overflow = '';
    }
  }

  document.addEventListener('click', e => {
    const opener = e.target.closest('#evaluateOpen,#formulaOpen,#commentsOpen');
    if (opener) {
      if (opener.id === 'evaluateOpen') openModal(evaluateModal);
      if (opener.id === 'formulaOpen') openModal(formulaModal);
      if (opener.id === 'commentsOpen') {
        openModal(commentsModal);
        loadComments();
      }
      return;
    }

    const closer = e.target.closest('[data-close]');
    if (closer) closeModal($(closer.dataset.close));
    if (e.target.classList.contains('tool-modal')) closeModal(e.target);
  });

  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    [evaluateModal, formulaModal, commentsModal].forEach(m => { if (!m.hidden) closeModal(m); });
  });

  async function postData(path, body) {
    const r = await fetch(`${API}${path}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const contentType = r.headers.get('content-type') || '';
    const data = contentType.includes('application/json')
      ? await r.json().catch(() => ({}))
      : await r.text().catch(() => '');
    if (!r.ok) {
      const detail = typeof data === 'object' && data?.detail
        ? (typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail))
        : String(data || `HTTP ${r.status}`);
      throw new Error(detail);
    }
    return data;
  }

  const showResult = (id, value, error = false) => {
    const box = $(id);
    box.hidden = false;
    box.classList.toggle('err', error);
    box.textContent = value;
  };

  $('evaluateForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.currentTarget, submit = form.querySelector('[type="submit"]');
    const expression = $('expressionInput').value.trim();
    if (!expression) return;
    submit.disabled = true;
    try {
      const data = await postData('/evaluate', {expression});
      const value = data && typeof data === 'object' && 'result' in data ? data.result : data;
      showResult('evaluateResult', `Результат: ${typeof value === 'string' ? value : JSON.stringify(value)}`);
    } catch (err) {
      showResult('evaluateResult', err.message || 'Ошибка вычисления', true);
    } finally {
      submit.disabled = false;
    }
  });

  $('formulaForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.currentTarget, submit = form.querySelector('[type="submit"]');
    const a = Number($('formulaA').value), b = Number($('formulaB').value), opName = $('formulaOp').value.trim();
    if (!Number.isFinite(a) || !Number.isFinite(b) || !opName) return;
    submit.disabled = true;
    try {
      // FormulaInput expects one YAML string, not separate a/b/op fields.
      const yamlConfig = `a: ${a}\nb: ${b}\nop: ${opName}`;
      const data = await postData('/formula', {yaml_config: yamlConfig});
      const value = data && typeof data === 'object' && 'result' in data ? data.result : data;
      showResult('formulaResult', `Результат: ${typeof value === 'string' ? value : JSON.stringify(value)}`);
    } catch (err) {
      showResult('formulaResult', err.message || 'Ошибка вычисления', true);
    } finally {
      submit.disabled = false;
    }
  });

  async function loadComments() {
    const list = $('commentList');
    const box = $('commentResult');
    box.hidden = true;
    list.innerHTML = '<div style="font-size:12px;color:var(--ink-soft)">Загрузка…</div>';
    try {
      const r = await fetch(`${API}/comment`);
      const markup = await r.text();
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      // Backend deliberately returns ready-to-render HTML (<ul><li>…</li></ul>).
      list.innerHTML = markup;
    } catch (err) {
      list.innerHTML = '';
      showResult('commentResult', err.message || 'Не удалось загрузить комментарии', true);
    }
  }

  $('commentForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.currentTarget, submit = form.querySelector('[type="submit"]');
    const comment = $('commentInput').value.trim();
    if (!comment) return;
    submit.disabled = true;
    try {
      // CommentInput expects the field to be named exactly 'text'.
      const r = await fetch(`${API}/comment`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text: comment})
      });
      const markup = await r.text();
      if (!r.ok) throw new Error(markup || `HTTP ${r.status}`);

      // POST may return either the refreshed <ul> or the new <li>.
      if (/<ul[\s>]/i.test(markup)) {
        $('commentList').innerHTML = markup;
      } else if (/<li[\s>]/i.test(markup)) {
        let ul = $('commentList').querySelector('ul');
        if (!ul) {
          ul = document.createElement('ul');
          $('commentList').replaceChildren(ul);
        }
        ul.insertAdjacentHTML('beforeend', markup);
      } else {
        await loadComments();
      }

      $('commentInput').value = '';
      $('commentResult').hidden = true;
    } catch (err) {
      showResult('commentResult', err.message || 'Не удалось добавить комментарий', true);
    } finally {
      submit.disabled = false;
    }
  });

  // статус API
  fetch(`${API}/version`).then(r => r.json()).then(d => {
    $('dot').className = 'dot ok'; $('ver').textContent = 'API v' + d.version;
  }).catch(() => { $('dot').className = 'dot bad'; $('ver').textContent = 'API недоступен'; });

  render();
})();
</script>
</body>
</html>
